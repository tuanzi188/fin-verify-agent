name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # 3.10 是声明的下限，3.12 覆盖本地开发版本：两端都过才说明代码没吃版本方言。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run tests
        run: pytest --cov=app --cov-report=xml -v
      - name: Verify OpenAPI schema is up to date
        # 与 Python 版本无关，跑一次即可，避免矩阵里两个 job 出同样的 diff
        if: matrix.python-version == '3.10'
        run: |
          python scripts/generate_schema.py
          git diff --exit-code -- frontend/openapi.json
      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify generated API types are up to date
        run: |
          npx openapi-typescript openapi.json -o src/api/generated.ts
          git diff --exit-code -- src/api/generated.ts
      - name: Run tests
        run: npx vitest run
      - name: Build frontend
        run: |
          npx tsc --noEmit
          npm run build

  # 检索质量回归门禁已并入 backend-tests：tests/test_block_retrieval_regression.py
  # 用合成语料 + hash embedding 覆盖块切分、核心表加权、公司/期间过滤与排序，
  # 不需要 API Key、模型下载或本地语料。通用 RAG 下线时一并移除了旧门禁。

